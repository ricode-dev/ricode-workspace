name: Build and publish workspace image

on:
  push:
    tags:
      - 'release/v*'
      - 'alpha/v*'
      - 'beta/v*'
      - 'pre-release/v*'

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/azka2606/ricode-workspace

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
        run: echo "$DOCKER_PAT" | docker login docker.io --username "$DOCKER_USER" --password-stdin

      - name: Resolve image tags from Git tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git_tag="${GITHUB_REF_NAME}"

          case "$git_tag" in
            release/*)
              if [[ "$git_tag" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
                version="${BASH_REMATCH[1]}"
                latest_tag='latest'
              fi
              ;;
            alpha/*)
              if [[ "$git_tag" =~ ^alpha/v([0-9]+\.[0-9]+\.[0-9]+)-alpha([0-9]+)$ ]]; then
                version="${BASH_REMATCH[1]}-alpha${BASH_REMATCH[2]}"
                latest_tag='latest-alpha'
              fi
              ;;
            beta/*)
              if [[ "$git_tag" =~ ^beta/v([0-9]+\.[0-9]+\.[0-9]+)-beta([0-9]+)$ ]]; then
                version="${BASH_REMATCH[1]}-beta${BASH_REMATCH[2]}"
                latest_tag='latest-beta'
              fi
              ;;
            pre-release/*)
              if [[ "$git_tag" =~ ^pre-release/v([0-9]+\.[0-9]+\.[0-9]+)-pre-release([0-9]+)$ ]]; then
                version="${BASH_REMATCH[1]}-pre-release${BASH_REMATCH[2]}"
                latest_tag='latest-pre-release'
              fi
              ;;
          esac

          if [[ -z "${version:-}" || -z "${latest_tag:-}" ]]; then
            echo "Unsupported tag: $git_tag" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE_NAME}:${version} and ${IMAGE_NAME}:${latest_tag}"

      - name: Build image
        run: docker build --pull --tag "${IMAGE_NAME}:${{ steps.version.outputs.version }}" .

      - name: Push version and channel tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LATEST_TAG: ${{ steps.version.outputs.latest_tag }}
        run: |
          docker tag "${IMAGE_NAME}:${VERSION}" "${IMAGE_NAME}:${LATEST_TAG}"
          docker push "${IMAGE_NAME}:${VERSION}"
          docker push "${IMAGE_NAME}:${LATEST_TAG}"

      - name: Publish README to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
          repository: azka2606/ricode-workspace
          readme-filepath: ./README.md
          enable-url-completion: true
